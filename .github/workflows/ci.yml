# Team 9 CI. Every job below is intended to block merging and deployment when it fails.
# Branch protection is not configured yet; until it is, "blocking" is a team rule, not enforced.
name: ci

on:
  push:
    branches: [main, "phase3/**", "bootstrap/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Windows is included because the team develops there and has hit Windows-only defects.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv (pinned, same as README)
        run: python -m pip install uv==0.13.1
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy app tester
      - name: Unit and contract tests
        run: uv run pytest tests/unit tests/contract
      - name: OpenAPI catalogs are current
        run: uv run python -m scripts.export_schemas --check
      - name: Identity vectors
        run: uv run python -m scripts.check_identity
      - name: Synthetic fixtures match generator
        run: uv run python -m scripts.make_synthetic_fixtures --check
      - name: Live process smoke test
        run: uv run python -m scripts.smoke_foundation
      - name: Live tester self-check (test-only fake target)
        run: uv run python -m scripts.tester_selfcheck

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv (pinned, same as README)
        run: python -m pip install uv==0.13.1
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Audit locked runtime dependencies (including measurement extra)
        run: |
          uv export --locked --no-dev --extra measurement --no-emit-project \
            --format requirements-txt --output-file "$RUNNER_TEMP/runtime-requirements.txt" > /dev/null
          uv run pip-audit --require-hashes --disable-pip \
            --cache-dir "$RUNNER_TEMP/audit-cache" -r "$RUNNER_TEMP/runtime-requirements.txt"
