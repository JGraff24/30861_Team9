name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: aws-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.AWS_DEPLOY_ROLE_ARN != '' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
      AWS_INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
      AWS_DEPLOY_DOCUMENT: ${{ vars.AWS_DEPLOY_DOCUMENT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - name: Require successful push CI for the current main commit
        id: eligible
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m scripts.deploy_aws check --sha "$RELEASE_SHA"
      - name: Authenticate to AWS using GitHub OIDC
        if: steps.eligible.outputs.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: team9-deploy-${{ github.run_id }}
          role-duration-seconds: 3600
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy the exact tested commit through Systems Manager
        if: steps.eligible.outputs.deploy == 'true'
        run: >-
          python3 -m scripts.deploy_aws run --sha "$RELEASE_SHA"
          --region "$AWS_REGION" --instance-id "$AWS_INSTANCE_ID"
          --document-name "$AWS_DEPLOY_DOCUMENT"
