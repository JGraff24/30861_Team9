<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workbook accessibility checks</title><link rel="stylesheet" href="{{ base }}/ui/style.css">
<script src="{{ base }}/ui/app.js" defer></script></head>
<body data-base="{{ base }}"><main>
<h1>Workbook accessibility checks</h1>
<p>Upload an Excel workbook for two checks: image alternative text and default worksheet names.
Results support human review and are not a compliance determination.</p>
<form id="upload">
<label for="token">User access token</label>
<input id="token" aria-describedby="token-help" type="password" autocomplete="off" spellcheck="false" required>
<p id="token-help">Use your user token. It stays in memory for this page only.</p>
<label for="file">Excel workbook (.xlsx)</label>
<input id="file" name="file" type="file" accept=".xlsx" required>
<button id="submit" type="submit">Upload and check</button>
</form>
<p id="status" role="status" aria-live="polite" aria-atomic="true"></p>
<p id="error" role="alert"></p>
<button id="retry" type="button" hidden>Resume checking this upload</button>
<section id="results" aria-labelledby="results-heading" hidden>
<h2 id="results-heading" tabindex="-1">Results</h2>
<dl id="metadata"></dl><h3>Findings</h3><p id="empty"></p><ul id="findings"></ul>
<h3>Limitations</h3><ul id="limitations"></ul>
</section></main></body></html>
