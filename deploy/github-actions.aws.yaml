AWSTemplateFormatVersion: '2010-09-09'
Description: GitHub main branch deployment to the existing Team 9 EC2 instance through SSM.
Parameters:
  InstanceId:
    Type: AWS::EC2::Instance::Id
    Default: i-0922ebb45b0bed415
  GitHubOwner:
    Type: String
    Default: JGraff24
    AllowedPattern: '[A-Za-z0-9-]+'
  GitHubOwnerId:
    Type: String
    Default: '194822762'
    AllowedPattern: '[0-9]+'
  GitHubRepository:
    Type: String
    Default: '30861_Team9'
    AllowedPattern: '[A-Za-z0-9_.-]+'
  GitHubRepositoryId:
    Type: String
    Default: '1419357952'
    AllowedPattern: '[0-9]+'
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: ''
    Description: Leave empty to create the GitHub OIDC provider; supply its ARN if this account already has one.
    AllowedPattern: '^$|arn:aws:iam::[0-9]{12}:oidc-provider/token.actions.githubusercontent.com'
Conditions:
  CreateProvider: !Equals [!Ref ExistingGitHubOidcProviderArn, '']
Resources:
  GitHubProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
  DeployCommand:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      DocumentFormat: YAML
      UpdateMethod: NewVersion
      Content:
        schemaVersion: '2.2'
        description: Deploy one tested main SHA using the repository's deployment script.
        parameters:
          ReleaseSha:
            type: String
            allowedPattern: '^[0-9a-f]{40}$'
        mainSteps:
          - action: aws:runShellScript
            name: deploy
            inputs:
              timeoutSeconds: '2400'
              runCommand:
                - 'set -eu'
                - 'TEAM9_JOB_DIR=$(mktemp -d /var/tmp/team9-deploy.XXXXXX)'
                - 'trap ''rm -rf "$TEAM9_JOB_DIR"'' EXIT'
                - !Sub >-
                    curl --fail --silent --show-error --location --max-time 60
                    'https://raw.githubusercontent.com/${GitHubOwner}/${GitHubRepository}/{{ ReleaseSha }}/scripts/deploy_host.py'
                    -o "$TEAM9_JOB_DIR/deploy.py"
                - !Sub 'python3 "$TEAM9_JOB_DIR/deploy.py" "{{ ReleaseSha }}" "${GitHubOwner}/${GitHubRepository}"'
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateProvider
                - !Ref GitHubProvider
                - !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
                'token.actions.githubusercontent.com:sub':
                  - !Sub 'repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepository}@${GitHubRepositoryId}:ref:refs/heads/main'
      Policies:
        - PolicyName: deploy-existing-host
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${DeployCommand}'
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${InstanceId}'
              - Effect: Allow
                Action: ssm:GetCommandInvocation
                Resource: '*'
Outputs:
  AWSDeployRoleArn:
    Value: !GetAtt DeployRole.Arn
  AWSDeployDocument:
    Value: !Ref DeployCommand
  AWSInstanceId:
    Value: !Ref InstanceId
  AWSRegion:
    Value: !Ref AWS::Region
